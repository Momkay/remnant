<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script type="importmap">{"imports":{"three":"./src/vendor/three.module.js"}}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05060A">
<title>Remnant</title>
<meta name="description" content="A dying star that burns in the colours of whatever your computer is playing. Audio stays in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305060A'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%23fff'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23FFB020' stroke-width='2' stroke-dasharray='6 4'/%3E%3C/svg%3E">
<style>
  :root {
    --ground: #05060A;
    --ink: #F2F0EA;
    --ink-soft: #9C9990;
    --on-ink: #0B0A09;
    --panel: rgba(6,8,14,.74);
    --step: #1B1F28;
    --line: rgba(242,240,234,.3);
    --track: rgba(242,240,234,.22);
    --ease: cubic-bezier(.2,.7,.2,1);
    --dur-in: 260ms;
    --dur-out: 420ms;
    --frame: 24px;
    --head: 48px;
    --ctl: 32px;            /* height of every button, segment, slider and icon button */
    --fs-label: 11px;       /* labels */
    --fs-text: 12px;        /* buttons, statements, status, notes */
    --s1: 8px; --s2: 16px; --s3: 24px;   /* the only spacing steps */
    --font: "JetBrains Mono", "Space Mono", "Cascadia Mono", Consolas, ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (max-width: 719px) { :root { --frame: 16px; --head: 56px; } }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100dvh; overflow: hidden; background: var(--ground); color: var(--ink); overscroll-behavior: none; font-family: var(--font); font-variant-numeric: tabular-nums; -webkit-tap-highlight-color: transparent; }
  canvas { display: block; touch-action: none; }
  #c { width: 100vw; height: 100dvh; cursor: grab; }
  #c:active { cursor: grabbing; }
  button { font: inherit; color: inherit; background: none; border: 0; border-radius: 0; cursor: pointer; text-transform: uppercase; letter-spacing: .02em; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* ---------- Header ---------- */
  #top { position: fixed; top: 0; left: 0; right: 0; height: var(--head); padding: 0 var(--frame); display: flex; align-items: center; justify-content: space-between; }
  .brand { font-size: 13px; line-height: 1; font-weight: 700; letter-spacing: .02em; }

  /* ---------- First screen ---------- */
  #intro { position: fixed; left: var(--frame); bottom: calc(var(--frame) + env(safe-area-inset-bottom)); max-width: 360px; display: flex; flex-direction: column; align-items: flex-start; gap: var(--s2); }
  @media (max-width: 719px) { #intro { right: var(--frame); max-width: none; } }
  #intro > * { --d: calc(var(--i) * 70ms);
    transition-property: opacity, transform, visibility; transition-timing-function: var(--ease);
    transition-duration: var(--dur-out), var(--dur-out), 0s; transition-delay: calc(800ms + var(--d)), calc(800ms + var(--d)), 0s; }
  body.running #intro > * { opacity: 0; transform: translateY(-16px); visibility: hidden;
    transition-delay: var(--d), var(--d), calc(var(--d) + var(--dur-out)); }
  h1 { font-size: clamp(28px, 3.4vw, 48px); line-height: 1; letter-spacing: -.04em; font-weight: 700; text-transform: uppercase; }
  .statement { font-size: var(--fs-text); line-height: 1.6; font-weight: 400; color: var(--ink-soft); max-width: 30em; }
  
  .note { opacity: .7; font-size: var(--fs-label); line-height: 1.6; color: var(--ink-soft); max-width: 40em; }
  .actions { display: flex; gap: var(--s1); flex-wrap: wrap; }
  .btn { height: var(--ctl); padding: 0 var(--s2); font-size: var(--fs-text); line-height: 1; font-weight: 700; border: 1px solid var(--line); transition: background-color 90ms linear, color 90ms linear, transform 90ms linear, opacity 90ms linear; }
  .btn > span { display: block; }
  .btn > span::before { content: "[ "; }
  .btn > span::after { content: " ]"; }
  .btn.primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  .btn.secondary { color: var(--ink); }
  .btn[hidden] { display: none; }
  .btn:disabled { opacity: .5; cursor: default; }
  @media (hover: hover) {
    .btn.primary:not(:disabled):hover { background: transparent; color: var(--ink); }
    .btn.secondary:not(:disabled):hover { background: var(--ink); color: var(--on-ink); }
  }
  .btn:not(:disabled):active { transform: scale(.98); }

  .specbox { min-width: 0; }
  .spec { display: block; width: 100%; }

  /* ---------- Control bar ---------- */
  #bar { position: fixed; left: 0; right: 0; margin-inline: auto; width: max-content; max-width: calc(100vw - 2 * var(--frame)); bottom: calc(var(--frame) + env(safe-area-inset-bottom)); color: var(--ink);
    display: flex; align-items: center; gap: var(--s2);
    transition: opacity var(--dur-in) var(--ease), transform var(--dur-in) var(--ease), visibility 0s; }
  #bar:not(.is-hidden) { opacity: .6; }
  #bar:not(.is-hidden):hover, #bar:focus-within { opacity: 1; }
  #bar.is-hidden { opacity: 0; transform: translateY(12px); visibility: hidden; transition: opacity var(--dur-out) var(--ease), transform var(--dur-out) var(--ease), visibility 0s linear var(--dur-out); }
  #bar > * { transition: opacity var(--dur-in) var(--ease); }
  #bar.is-hidden > * { opacity: 0; transition: none; }
  #bar:not(.is-hidden) > * { transition-delay: calc(var(--i) * 50ms); }
  body:not(.running) #bar { display: none; }
  #bar .specbox { flex: 0 1 160px; }
  #spec-bar { height: 16px; }

  .sliders { display: contents; }
  .seg-group { display: flex; height: var(--ctl); border: 1px solid var(--line); }
  .tools { display: flex; gap: var(--s1); }
  .seg { width: 56px; font-size: var(--fs-text); font-weight: 700; line-height: 1; color: var(--ink-soft); }
  .seg[aria-checked="true"] { background: var(--ink); color: var(--on-ink); }
  .status { font-size: var(--fs-text); line-height: 1; white-space: nowrap; text-transform: uppercase; color: var(--ink); }
  .status:empty { display: none; }
  .status::before { content: "// "; color: var(--ink-soft); }
  .field { display: flex; align-items: center; gap: var(--s1); }
  .field > span { font-size: var(--fs-label); line-height: 1; min-width: 0; text-transform: uppercase; color: var(--ink-soft); }
  .auto { height: var(--ctl); padding: 0 var(--s2); font-size: var(--fs-text); font-weight: 700; color: var(--ink-soft); border: 1px solid var(--line); }
  .auto[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
  .icon-btn { width: var(--ctl); height: var(--ctl); display: grid; place-items: center; border: 1px solid var(--line); }
  .icon-btn svg { width: 14px; height: 14px; fill: var(--ink); stroke: var(--ink); stroke-width: 1.75; stroke-linecap: square; stroke-linejoin: miter; }
  .icon-btn .on, .icon-btn[aria-pressed="true"] .off { display: none; }
  .icon-btn[aria-pressed="true"] .on { display: block; }
  #fs[hidden] { display: none; }
  #tune-btn[aria-expanded="true"] { background: var(--ink); border-color: var(--ink); }
  #tune-btn[aria-expanded="true"] svg { fill: var(--on-ink); stroke: var(--on-ink); }
  @media (hover: hover) { .seg:not([aria-checked="true"]):hover, .auto:not([aria-pressed="true"]):hover, .icon-btn:not([aria-expanded="true"]):hover { background: var(--step); } }
  .tune { position: absolute; right: -1px; bottom: calc(100% + var(--s1)); width: min(380px, calc(100vw - 2 * var(--frame))); background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    display: grid; grid-template-columns: 1fr 1fr; gap: 0 var(--s3); padding: var(--s1) var(--s2); }
  .tune[hidden] { display: none; }
  .tune .field { flex-direction: column; align-items: stretch; gap: 0; min-width: 0; }
  .tune .field > span { min-width: 0; }
  .tune input { width: 100%; }

  input[type=range] { -webkit-appearance: none; appearance: none; width: 80px; height: var(--ctl); background: transparent; --v: 50%; }
  input[type=range]::-webkit-slider-runnable-track { height: 2px; background: linear-gradient(to right, var(--ink) var(--v), var(--track) var(--v)); }
  input[type=range]::-moz-range-track { height: 2px; background: linear-gradient(to right, var(--ink) var(--v), var(--track) var(--v)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; background: var(--ground); border: 1px solid var(--ink); border-radius: 0; }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; background: var(--ground); border: 1px solid var(--ink); border-radius: 0; }

  /* The one-row bar needs about 1100 px. Below that it becomes three rows. */
  @media (max-width: 1099px) {
    #bar { display: grid; grid-template-columns: auto 1fr auto; column-gap: var(--s2); row-gap: var(--s1); align-items: center; padding: var(--s2); }
    .tools { display: contents; }
    #bar > .seg-group { grid-column: 1; grid-row: 2; }
    #bar > .specbox { grid-column: 2 / 4; grid-row: 2; max-width: none; }
    #bar > .status { grid-column: 1 / -1; grid-row: 1; }
    #bar > .tools { grid-column: 1 / -1; grid-row: 4; display: flex; justify-content: flex-end; gap: var(--s1); }
    #bar > .sliders { grid-column: 1 / -1; grid-row: 3; display: grid; grid-template-columns: 1fr 1fr; gap: 0 var(--s3); }
    .sliders > .field { flex-direction: column; align-items: stretch; gap: 0; min-width: 0; }
    .sliders > .field > span { min-width: 0; padding-top: var(--s1); }
    .sliders input { width: 100%; }
    #f-detail .row { gap: 8px; }
    #f-detail input { flex: 1; width: auto; min-width: 0; }
  }
  @media (max-width: 1099px) and (max-height: 500px) and (orientation: landscape) {
    #bar { display: flex; gap: var(--s3); padding: var(--s1) var(--s2); }
    #bar > .tools { display: flex; }
    #bar > * { grid-column: auto; grid-row: auto; }
    #bar > .sliders { display: contents; }
    .sliders > .field { flex-direction: row; align-items: center; gap: var(--s2); }
    .sliders > .field > span { min-width: 92px; padding: 0; }
    .sliders input { width: 100px; }
    #f-detail { display: none; }
  }
  #f-detail .row { display: flex; align-items: center; gap: var(--s1); }

  @media (prefers-reduced-motion: reduce) {
    body.running #intro > * { transform: none; }
    #bar.is-hidden { transform: none; }
  }
  @media (forced-colors: active) {
    .btn, #bar, .seg, .auto, .icon-btn { border: 1px solid ButtonText; }
    .seg[aria-checked="true"], .auto[aria-pressed="true"] { forced-color-adjust: none; background: Highlight; color: HighlightText; }
  }
</style>

</head>
<body>
<canvas id="c"></canvas>
<header id="top">
  <div class="brand">REMNANT_</div>
</header>
<main id="intro">
  <h1 style="--i:0">Remnant_</h1>
  <p class="statement" id="statement" style="--i:1">A dying star that burns in the colours of whatever your computer is playing.</p>
  <div class="actions" style="--i:3">
    <button class="btn primary" id="btn-a" type="button"><span></span></button>
    <button class="btn secondary" id="btn-b" type="button"><span></span></button>
  </div>
  <p class="note" id="note" style="--i:4"></p>
</main>

<div id="bar" class="is-hidden" role="toolbar" aria-label="Controls" inert>
  <div class="seg-group" role="radiogroup" aria-label="Source" style="--i:0">
    <button class="seg" type="button" role="radio" aria-checked="true" data-kind="display" tabindex="0" aria-keyshortcuts="S">System</button>
    <button class="seg" type="button" role="radio" aria-checked="false" data-kind="mic" tabindex="-1" aria-keyshortcuts="M">Mic</button>
  </div>
  <span class="status" id="status" style="--i:1"></span>
  <div class="specbox" aria-hidden="true" style="--i:2"><canvas id="spec-bar" class="spec"></canvas></div>
  <div class="sliders">
    <label class="field" id="f-sens" style="--i:3"><span id="sens-label">Sensitivity</span>
      <input type="range" id="sens" min="0" max="100" value="50" aria-labelledby="sens-label" aria-keyshortcuts="ArrowUp ArrowDown"></label>
    <div class="field" id="f-detail" style="--i:4"><span id="detail-label">Detail</span>
      <div class="row"><input type="range" id="detail" min="25" max="100" value="100" aria-labelledby="detail-label">
      <button class="auto" id="auto" type="button" aria-pressed="true">Auto</button></div></div>
  </div>
  <div class="tools" style="--i:5">
  <button class="icon-btn" id="tune-btn" type="button" aria-label="Particle controls" aria-expanded="false" aria-controls="tune" aria-keyshortcuts="T">
    <svg viewBox="0 0 20 20" aria-hidden="true" fill="none"><path d="M3 5h14M3 10h14M3 15h14"/><rect x="6" y="3" width="3" height="4" stroke="none"/><rect x="12" y="8" width="3" height="4" stroke="none"/><rect x="5" y="13" width="3" height="4" stroke="none"/></svg>
  </button>
  <button class="icon-btn" id="pause" type="button" aria-label="Pause" aria-pressed="false" aria-keyshortcuts="Space">
    <svg viewBox="0 0 20 20" aria-hidden="true"><g class="off"><rect x="4" y="3" width="4" height="14" stroke="none"/><rect x="12" y="3" width="4" height="14" stroke="none"/></g><path class="on" d="M5 3 L16 10 L5 17 Z" stroke="none"/></svg>
  </button>
  <button class="icon-btn" id="fs" type="button" aria-label="Enter fullscreen" aria-pressed="false" aria-keyshortcuts="F">
    <svg viewBox="0 0 20 20" aria-hidden="true" fill="none"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg>
  </button>
  </div>
  <div id="tune" class="tune" role="group" aria-label="Particle controls" hidden>
    <label class="field"><span id="t-amount-l">Amount</span><input type="range" id="t-amount" min="0" max="100" value="80" aria-labelledby="t-amount-l"></label>
    <label class="field"><span id="t-size-l">Size</span><input type="range" id="t-size" min="0" max="100" value="0" aria-labelledby="t-size-l"></label>
    <label class="field"><span id="t-chaos-l">Chaos</span><input type="range" id="t-chaos" min="0" max="100" value="50" aria-labelledby="t-chaos-l"></label>
    <label class="field"><span id="t-burst-l">Burst</span><input type="range" id="t-burst" min="0" max="100" value="20" aria-labelledby="t-burst-l"></label>
  </div>
</div>

<div id="live" class="sr" aria-live="polite" role="status"></div>
<script type="module" src="src/boot.js"></script>
</body>
</html>
